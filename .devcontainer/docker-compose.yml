# Ontwikkelomgeving: de app, een PostgreSQL-database en Mailpit (testpostvak).
# Alleen voor ontwikkelen in Codespaces; productie gebruikt de Dockerfile in de hoofdmap.
services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "alleen-voor-ontwikkeling-niet-in-productie-gebruiken"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,.app.github.dev"
      DJANGO_CSRF_TRUSTED_ORIGINS: "https://*.app.github.dev"
      DATABASE_URL: "postgres://vdk:vdk@db:5432/vdk"
      EMAIL_HOST: "mailpit"
      EMAIL_PORT: "1025"
    depends_on:
      - db
      - mailpit

  db:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: vdk
      POSTGRES_PASSWORD: vdk
      POSTGRES_DB: vdk

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped

volumes:
  postgres-data:
